<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>goole classroom</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" id="newChatBtn">
          <span>+</span> 新建对话
        </button>
      </div>
      <div class="history-list" id="historyList"></div>
    </aside>
    <div class="sidebar-mask" id="sidebarMask"></div>

    <!-- 主区域 -->
    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="菜单">☰</button>
        <div class="model-name" id="modelName">goole classroom</div>
      </header>

      <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
          <h1>有什么可以帮你？</h1>
          <p>输入消息开始对话</p>
        </div>
      </div>

      <div class="composer">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="给 AI 发送消息…"></textarea>
          <button id="sendBtn" aria-label="发送">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3.4 20.4 22 12 3.4 3.6l.1 6.8 13 1.6-13 1.6z"/></svg>
          </button>
        </div>
        <div class="disclaimer">AI 生成内容仅供参考。</div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
